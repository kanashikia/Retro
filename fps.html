<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tiny FPS - Retro</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100vw; height: 100dvh; }
    #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
      font: 600 16px/1.5 system-ui, sans-serif; color: #e5e7eb; background: #000c; }
    #msg[hidden] { display: none; }
  </style>
</head>

<body>
  <div id="game"></div>
  <div id="msg">Loading the game...</div>
  <script type="module" src="/src/fps/main.ts"></script>
</body>

</html>
